services:
  baileys-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: baileys-bot
    restart: unless-stopped
    networks:
      - baileys-network
    
    # Variables de entorno
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Lima
    
    # Volúmenes persistentes
    volumes:
      - ./session:/usr/src/app/session
      - ./uploads:/usr/src/app/uploads
      - ./public:/usr/src/app/public
    
    # Sin exposición de puertos directos (solo a través de Nginx)
    expose:
      - "3000"
    
    # Límites de recursos (opcional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx como Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    networks:
      - baileys-network
    
    ports:
      - "2080:80"
      - "2443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Para certificados SSL
      - ./public:/usr/share/nginx/html/public:ro
    
    depends_on:
      - baileys-bot
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  baileys-network:
    driver: bridge