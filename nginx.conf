upstream baileys_app {
    server baileys-bot:3000;
}

# SDRIMSAC.LAT - Socket.io + API en puerto 3000
server {
    listen 80;
    server_name sdrimsac.lat www.sdrimsac.lat;
    
    # Redirigir HTTP a HTTPS (recomendado)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sdrimsac.lat www.sdrimsac.lat;
    
    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/sdrimsac.lat.crt;
    ssl_certificate_key /etc/nginx/ssl/sdrimsac.lat.key;
    
    # Configuración SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Todo redirige a la app en puerto 3000
    location / {
        proxy_pass http://baileys_app;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}

# SDRIMSAC.XYZ - Servidor externo (opcional)
server {
    listen 80;
    server_name sdrimsac.xyz www.sdrimsac.xyz;
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sdrimsac.xyz www.sdrimsac.xyz;
    
    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/sdrimsac.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/sdrimsac.xyz.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Redirigir a sdrimsac.lat
    location / {
        return 301 https://sdrimsac.lat$request_uri;
    }
}
