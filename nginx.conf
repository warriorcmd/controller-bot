upstream baileys_app {
    server baileys-bot:3000;
}

# Servidor para sdrimsac.lat (donde se accede la aplicación)
server {
    listen 80;
    server_name sdrimsac.lat www.sdrimsac.lat;
    
    # Redirigir HTTP a HTTPS (recomendado en producción)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sdrimsac.lat www.sdrimsac.lat;
    
    # Certificados SSL (reemplaza con tus rutas)
    ssl_certificate /etc/nginx/ssl/sdrimsac.lat.crt;
    ssl_certificate_key /etc/nginx/ssl/sdrimsac.lat.key;
    
    # Configuración SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Proxy para requests HTTP normales
    location / {
        proxy_pass http://baileys_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    
    # WebSocket para Socket.io (conexión a sdrimsac.xyz)
    location /socket.io {
        proxy_pass http://baileys_app/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

# Servidor para sdrimsac.xyz (solo WebSocket)
server {
    listen 80;
    server_name sdrimsac.xyz www.sdrimsac.xyz;
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sdrimsac.xyz www.sdrimsac.xyz;
    
    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/sdrimsac.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/sdrimsac.xyz.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Redirigir raíz a la app principal
    location / {
        return 301 https://sdrimsac.lat;
    }
    
    # WebSocket disponible aquí
    location /socket.io {
        proxy_pass http://baileys_app/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
